  color: var(--color-muted);
  font-weight: 400;
}
.tcs__term--b {
  background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
  color: var(--brand-strong);
}
.tcs__terms {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.25rem;
}
.tcs__split {
  color: var(--brand-strong);
  font-size: 0.68rem;
  font-weight: 700;
}
.tcs__split::before {
  content: '↳ ';
}
.tcs .tcs__program--sharing tr.is-split {
  background: color-mix(in srgb, var(--brand-soft) 60%, var(--color-surface));
}
.tcs__bar--t {
  width: calc(var(--t) / var(--t-max) * (100% - 2rem));
}
.tcs .tcs__program--sharing tr.is-split .tcs__bar--t,
.tcs .tcs__program--sharing tbody tr:last-child .tcs__bar--t {
  background: var(--viz-series-1);
}
.tcs .tcs__outputs {
  display: grid;
  margin: 0.8rem 0 0;
  padding: 0;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: 0.35rem 1rem;
  list-style: none;
}
.tcs .tcs__outputs li {
  margin: 0;
  color: var(--color-muted);
  font-size: 0.74rem;
  line-height: 1.9;
}
.tcs__output-name {
  color: var(--color-fg);
  font-family: var(--sl-font-mono);
  font-weight: 700;
}
.tcs .tcs__lanes {
  margin: 0.7rem 0 0;
  color: var(--color-muted);
  font-size: 0.78rem;
}
.tcs__lanes strong {
  color: var(--color-fg);
}

/* --- Stabilizer tooltip ------------------------------------------------------------
 * One row per generator, with fixed-width tiles in the same columns as the
 * operation's row on top, so anticommuting positions line up. */
.tcs {
  position: relative;
}
.tcs .tcs__program tr[data-op] {
  cursor: help;
}
.tcs .tcs__program tr[data-op]:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: -2px;
}
.tcs__tip {
  position: absolute;
  z-index: 20;
  padding: 0.55rem 0.7rem 0.6rem;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface);
  box-shadow: 0 8px 24px rgb(0 0 0 / 18%);
  font-size: 0.74rem;
  pointer-events: none;
}
.tcs .tcs__tip-section {
  margin: 0 0 0.25rem;
  color: var(--color-muted);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.tcs .tcs__tip-note {
  margin: 0;
  color: var(--color-muted);
}
/* Same font size as the program rows, so the tiles below keep their size. */
.tcs__tip-row {
  display: flex;
  margin-bottom: 0.12rem;
  align-items: center;
  font-family: var(--sl-font-mono);
  font-size: 0.8rem;
  white-space: nowrap;
}
.tcs__tip-row.is-anti {
  border-radius: 4px;
  background: color-mix(in srgb, var(--tcs-x) 10%, transparent);
}

/* --- Phones ------------------------------------------------------------------------- */
@media (max-width: 40rem) {
  .tcs__nav {
    gap: 0.4rem;
  }
  .tcs .tcs__nav-button {
    padding-inline: 0.7rem;
  }
  .tcs__nav-label {
    display: none;
  }
  .tcs .tcs__program {
    font-size: 0.74rem;
  }
  .tcs .tcs__program th,
  .tcs .tcs__program td {
    padding-inline: 0.25rem;
  }
  .tcs .tcs__program td.tcs__what,
  .tcs .tcs__program td.tcs__noise {
    white-space: normal;
  }
  .tcs .tcs__program td.tcs__what {
    min-width: 4.2rem;
  }
  .tcs .tcs__program td.tcs__noise {
    min-width: 3rem;
    font-size: 0.64rem;
    line-height: 1.3;
  }
  .tcs .tcs__k-head,
  .tcs .tcs__k {
    width: auto;
    min-width: 3.6rem;
  }
  .tcs__p {
    width: 1.15rem;
  }
  .tcs__tip-row {
    font-size: 0.74rem;
  }
  .tcs__pauli-head > span[aria-hidden] > span {
    width: 1.25rem;
  }
  .tcs .tcs__frame-col {
    display: none;
  }
  .tcs__axis {
    display: inline-block;
    margin: 0.1rem 0 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .tcs__bar,
  .tcs__dots button::before {
    transition: none;
  }
}

 measurement","mode":"schedule","scheduled":[],"candidates":[{"measurement":10,"chain":[0,1,4,5,8,9],"trial":[1,2,3,3,3,3],"trial_stabilizers":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IZIII","IIZII"],["IZIII","IIZII"],["IZIII","IIZII"],["IZIII","IIZII"]],"peak":3,"chosen":true},{"measurement":11,"chain":[0,1,2,3,7,9],"trial":[1,2,3,4,4,4],"trial_stabilizers":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IIZII","IIIZI"],["IIIZI"],["IIIZI"],["IIIZI"]],"peak":4,"chosen":false},{"measurement":12,"chain":[0,1,2,3,5,6,9],"trial":[1,2,3,4,4,4,4],"trial_stabilizers":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IIZII","IIIZI"],["IIIZI"],["IIIZI"],["IIIZI"],["IIIZI"]],"peak":4,"chosen":false},{"measurement":13,"chain":[1,2,3,4,5,7,8],"trial":[1,2,3,4,4,4,4],"trial_stabilizers":[["IZIII","IIZII","IIIZI","IIIIZ"],["IIZII","IIIZI","IIIIZ"],["IIIZI","IIIIZ"],["IIIIZ"],["IIIIZ"],["IIIIZ"],["IIIIZ"]],"peak":4,"chosen":false},{"measurement":14,"chain":[0,1,3,4,5,7],"trial":[1,2,3,4,4,4],"trial_stabilizers":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IZIII","IIIZI"],["IZIII"],["IZIII"],["IZIII"]],"peak":4,"chosen":false}]},{"stage":1,"panel":0,"sub":"Run the best","mode":"schedule","scheduled":[0,1,4,5,8,9,10],"candidates":null},{"stage":1,"panel":0,"sub":"Try each measurement","mode":"schedule","scheduled":[0,1,4,5,8,9,10],"candidates":[{"measurement":11,"chain":[2,3,7],"trial":[3,4,4],"trial_stabilizers":[["IIZII","XIIII"],["XIIII"],["XIIII"]],"peak":4,"chosen":false},{"measurement":12,"chain":[2,3,6],"trial":[3,4,4],"trial_stabilizers":[["IIZII","XIIII"],["XIIII"],["XIIII"]],"peak":4,"chosen":false},{"measurement":13,"chain":[2,3,7],"trial":[3,4,4],"trial_stabilizers":[["IIZII","XIIII"],["XIIII"],["XIIII"]],"peak":4,"chosen":false},{"measurement":14,"chain":[3,7],"trial":[3,3],"trial_stabilizers":[["IZIII","XIIII"],["IZIII","XIIII"]],"peak":3,"chosen":true}]},{"stage":1,"panel":0,"sub":"Run the best","mode":"schedule","scheduled":[0,1,4,5,8,9,10,3,7,14],"candidates":null},{"stage":1,"panel":0,"sub":"Try each measurement","mode":"schedule","scheduled":[0,1,4,5,8,9,10,3,7,14],"candidates":[{"measurement":11,"chain":[2],"trial":[3],"trial_stabilizers":[["XIIII","XIXXX"]],"peak":3,"chosen":true},{"measurement":12,"chain":[2,6],"trial":[3,3],"trial_stabilizers":[["XIIII","XIXXX"],["XIIII","XIXXX"]],"peak":3,"chosen":false},{"measurement":13,"chain":[2],"trial":[3],"trial_stabilizers":[["XIIII","XIXXX"]],"peak":3,"chosen":false}]},{"stage":1,"panel":0,"sub":"Run the best","mode":"schedule","scheduled":[0,1,4,5,8,9,10,3,7,14,2,11],"candidates":null},{"stage":1,"panel":0,"sub":"Done","mode":"schedule","scheduled":[0,1,4,5,8,9,10,3,7,14,2,11,6,12,13],"candidates":null},{"stage":2,"panel":1,"sub":"","mode":null,"scheduled":null,"candidates":null},{"stage":3,"panel":2,"sub":"","mode":null,"scheduled":null,"candidates":null}]</script><script type="application/json" data-stabilizers>{"initial":["ZIIII","IZIII","IIZII","IIIZI","IIIIZ"],"read":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IIZII","IIIZI"],["IIIZI"],[],[],[],[],[],[],["XIIII"],["XIIII","XXXIX"],["XIIII","XXXIX","XIXII"],["XIIII","XXXIX","XIXII","XXIII"],["XIIII","XXXIX","XIXII","XXIII","XIXXX"]],"scheduled":[["ZIIII","IZIII","IIZII","IIIZI"],["IZIII","IIZII","IIIZI"],["IZIII","IIZII"],["IZIII","IIZII"],["IZIII","IIZII"],["IZIII","IIZII"],["IZIII","IIZII","XIIII"],["IZIII","XIIII"],["IZIII","XIIII"],["IZIII","XIIII","XIXXX"],["XIIII","XIXXX"],["XIIII","XIXXX","XXXIX"],["XIIII","XIXXX","XXXIX"],["XIIII","XIXXX","XXXIX","XIXII"],["XIIII","XIXXX","XXXIX","XIXII","XXIII"]],"paulis":["ZZIIX","XIIZZ","IYZIZ","IZYZI","ZIZYI","YIIZZ","IXZIZ","IZXZI","ZIZXI","ZZIIY","XIIII","XXXIX","XIXII","XXIII","XIXXX"]}</script></figure>
<script type="module">
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
document.querySelectorAll("[data-tcs]").forEach((root) => {
	if (root.dataset.tcsBound) return;
	root.dataset.tcsBound = "true";
	const frames = JSON.parse(root.querySelector("[data-frames]").textContent);
	const panels = [...root.querySelectorAll("[data-panel]")];
	const dots = [...root.querySelectorAll("[data-goto]")];
	const stageTitles = dots.map((dot) => dot.getAttribute("aria-label").replace(/^Step \d+: /, ""));
	const previous = root.querySelector("[data-prev]");
	const next = root.querySelector("[data-next]");
	const count = root.querySelector("[data-count]");
	const title = root.querySelector("[data-title]");
	const sub = root.querySelector("[data-sub]");
	const subGroups = [...root.querySelectorAll("[data-substeps]")];
	const subDots = [...root.querySelectorAll("[data-subgoto]")];
	let current = 0;
	/* --- Pauli program ---------------------------------------------------- */
	const body = root.querySelector("[data-program]").tBodies[0];
	const rows = [...body.querySelectorAll("tr[data-op]")];
	const divider = body.querySelector("[data-divider]");
	const waitingLabel = divider.querySelector("[data-waiting]");
	const readOrder = rows.map((_, op) => op);
	let shown = [];
	let trialChoice = -1;
	function setWidth(row, k, peak) {
		row.style.setProperty("--k", String(k ?? 0));
		row.classList.toggle("is-peak", k !== null && k === peak);
		row.querySelector("[data-k]").textContent = k === null ? "" : String(k);
	}
	/** Highlight one candidate's trial: its chain with trial widths, and the measurement. */
	function showTrial(frame, choice) {
		trialChoice = choice;
		const candidates = frame.candidates ?? [];
		const candidate = candidates[choice];
		const pending = new Set(candidates.map((c) => c.measurement));
		const chain = new Map(candidate ? candidate.chain.map((op, i) => [op, candidate.trial[i]]) : []);
		rows.forEach((row, op) => {
			const inTrial = chain.has(op);
			row.classList.toggle("is-chain", inTrial);
			row.classList.toggle("is-candidate", candidate?.measurement === op);
			row.classList.toggle("is-pending", pending.has(op) && candidate?.measurement !== op);
			if (frame.scheduled && !frame.scheduled.includes(op)) {
				row.classList.toggle("is-trial", inTrial);
				setWidth(row, inTrial ? chain.get(op) : null, candidate ? candidate.peak : -1);
			}
		});
	}
	function arrange(frame) {
		const before = new Map([...rows, divider].map((row) => [row, row.getBoundingClientRect().top]));
		const scheduling = frame.mode === "schedule";
		const scheduled = scheduling ? frame.scheduled : readOrder;
		const waiting = scheduling ? readOrder.filter((op) => !scheduled.includes(op)) : [];
		scheduled.forEach((op) => body.append(rows[op]));
		body.append(divider);
		waiting.forEach((op) => body.append(rows[op]));
		divider.hidden = !scheduling || waiting.length === 0;
		waitingLabel.textContent = `waiting · ${waiting.length} operation${waiting.length === 1 ? "" : "s"}`;
		const widths = scheduled.map((op) => Number(rows[op].dataset[scheduling ? "kScheduled" : "kRead"]));
		const peak = widths.length ? Math.max(...widths) : 0;
		rows.forEach((row) => row.classList.remove("is-chain", "is-candidate", "is-pending", "is-trial", "is-new"));
		scheduled.forEach((op, position) => {
			rows[op].classList.remove("is-waiting");
			rows[op].classList.toggle("is-new", scheduling && shown.length < scheduled.length && !shown.includes(op));
			setWidth(rows[op], widths[position], peak);
		});
		shown = scheduling ? scheduled : [];
		waiting.forEach((op) => {
			rows[op].classList.add("is-waiting");
			setWidth(rows[op], null, peak);
		});
		if (frame.candidates) showTrial(frame, frame.candidates.findIndex((c) => c.chosen));
		if (reduceMotion.matches) return;
		[...rows, divider].forEach((row) => {
			const shift = before.get(row) - row.getBoundingClientRect().top;
			if (!shift || row.hidden) return;
			row.animate([{ transform: `translateY(${shift}px)` }, { transform: "none" }], {
				duration: 450,
				easing: "cubic-bezier(0.2, 0.7, 0.2, 1)"
			});
		});
	}
	root.querySelectorAll("[data-frame-candidates]").forEach((group) => {
		const frame = frames[Number(group.dataset.frameCandidates)];
		const buttons = [...group.querySelectorAll("[data-candidate]")];
		buttons.forEach((button, k) => button.addEventListener("click", () => {
			buttons.forEach((other) => other.setAttribute("aria-pressed", String(other === button)));
			closeTip();
			showTrial(frame, k);
		}));
	});
	/* --- Stabilizer tooltip ------------------------------------------------
	* The generators before the row's operation, one aligned row each, with
	* those that anticommute with the operation marked. */
	const stabilizers = JSON.parse(root.querySelector("[data-stabilizers]").textContent);
	const tip = root.querySelector("[data-stabilizer-tip]");
	tip.id = `tcs-stabilizers-${crypto.randomUUID()}`;
	let tipRow = null;
	const anticommutes = (a, b) => [...a].filter((letter, q) => letter !== "I" && b[q] !== "I" && letter !== b[q]).length % 2 === 1;
	/** Generators just before `op` in the current frame, or null if it is not placed. */
	function stabilizersBefore(op) {
		const frame = frames[current];
		if (frame.mode === "read") return op ? stabilizers.read[op - 1] : stabilizers.initial;
		const scheduled = frame.scheduled ?? [];
		const position = scheduled.indexOf(op);
		if (position >= 0) return position ? stabilizers.scheduled[position - 1] : stabilizers.initial;
		const candidate = frame.candidates?.[trialChoice];
		const step = candidate ? candidate.chain.indexOf(op) : -1;
		if (!candidate || step < 0) return null;
		if (step) return candidate.trial_stabilizers[step - 1];
		return scheduled.length ? stabilizers.scheduled[scheduled.length - 1] : stabilizers.initial;
	}
	function tiles(pauli) {
		return [...pauli].map((letter) => `<span class="tcs__p tcs__p--${letter}">${letter === "I" ? "·" : letter}</span>`).join("");
	}
	function renderTip(op) {
		const before = stabilizersBefore(op);
		if (!before) return "<p class=\"tcs__tip-note\">Not scheduled yet.</p>";
		const pauli = stabilizers.paulis[op];
		const rows = before.map((string) => `<div class="tcs__tip-row${anticommutes(pauli, string) ? " is-anti" : ""}">${tiles(string)}</div>`);
		return `<p class="tcs__tip-section">Stabilizers before</p>${rows.join("") || "<p class=\"tcs__tip-note\">none</p>"}`;
	}
	/** Below (or above) the row, with the tooltip's tiles in the row's tile columns. */
	function placeTip(row) {
		const box = root.getBoundingClientRect();
		const rowBox = row.getBoundingClientRect();
		const height = tip.offsetHeight;
		const below = rowBox.bottom - box.top + 4;
		const above = rowBox.top - box.top - height - 4;
		const fitsBelow = rowBox.bottom + height + 8 < window.innerHeight;
		tip.style.top = `${fitsBelow || above < 0 ? below : above}px`;
		tip.style.left = "0px";
		const rowTile = row.querySelector(".tcs__p").getBoundingClientRect().left;
		const tipTile = tip.querySelector(".tcs__p");
		const offset = tipTile ? tipTile.getBoundingClientRect().left - tip.getBoundingClientRect().left : 12;
		const left = Math.min(rowTile - box.left - offset, box.width - tip.offsetWidth - 4);
		tip.style.left = `${Math.max(4, left)}px`;
	}
	function openTip(row) {
		closeTip();
		tipRow = row;
		row.setAttribute("aria-describedby", tip.id);
		tip.innerHTML = renderTip(Number(row.dataset.op));
		tip.hidden = false;
		placeTip(row);
	}
	function closeTip() {
		tipRow?.removeAttribute("aria-describedby");
		tipRow = null;
		tip.hidden = true;
	}
	// NOTE: a tap focuses the row before its click; only keyboard focus opens the
	// tooltip, so the click can toggle it without closing what focus opened.
	let pointer = "";
	root.addEventListener("pointerdown", (event) => pointer = event.pointerType);
	root.addEventListener("keydown", () => pointer = "");
	rows.forEach((row) => {
		row.addEventListener("pointerenter", (event) => event.pointerType === "mouse" && openTip(row));
		row.addEventListener("pointerleave", (event) => event.pointerType === "mouse" && closeTip());
		row.addEventListener("focus", () => !pointer && openTip(row));
		row.addEventListener("blur", closeTip);
		row.addEventListener("click", () => {
			if (pointer === "mouse") return;
			if (tipRow === row) closeTip();
			else openTip(row);
		});
	});
	window.addEventListener("scroll", () => tipRow && placeTip(tipRow), { passive: true });
	document.addEventListener("click", (event) => {
		if (tipRow && !event.target.closest?.("tr[data-op]")) closeTip();
	});
	/* --- Navigation ------------------------------------------------------- */
	function show(target) {
		const focused = document.activeElement instanceof HTMLElement && root.contains(document.activeElement) ? document.activeElement : null;
		closeTip();
		current = Math.max(0, Math.min(frames.length - 1, target));
		const frame = frames[current];
		panels.forEach((element, index) => element.hidden = index !== frame.panel);
		dots.forEach((dot, index) => index === frame.stage ? dot.setAttribute("aria-current", "step") : dot.removeAttribute("aria-current"));
		// A step with parts shows them in place of its dot while it is current.
		subGroups.forEach((group) => {
			const open = Number(group.dataset.substeps) === frame.stage;
			group.hidden = !open;
			dots[Number(group.dataset.substeps)].hidden = open;
		});
		subDots.forEach((dot) => {
			const index = Number(dot.dataset.subgoto);
			if (index === current) dot.setAttribute("aria-current", "step");
			else dot.removeAttribute("aria-current");
			dot.classList.toggle("is-done", index < current);
		});
		previous.disabled = current === 0;
		next.disabled = current === frames.length - 1;
		count.textContent = `${frame.stage + 1} / ${dots.length}`;
		title.textContent = stageTitles[frame.stage];
		sub.textContent = frame.sub;
		root.querySelectorAll("[data-frame-lead]").forEach((lead) => lead.hidden = Number(lead.dataset.frameLead) !== current);
		root.querySelectorAll("[data-frame-candidates]").forEach((group) => {
			group.hidden = Number(group.dataset.frameCandidates) !== current;
			group.querySelectorAll("[data-candidate]").forEach((button) => button.setAttribute("aria-pressed", String(button.classList.contains("is-winner"))));
		});
		if (frame.mode) arrange(frame);
		// Reordering rows can blur them, and stage changes can hide or disable
		// the active control. Keep keyboard navigation inside the visible step.
		if (focused) {
			const fallback = subDots.find((dot) => Number(dot.dataset.subgoto) === current && !dot.closest("[hidden]")) ?? dots[frame.stage];
			const destination = focused.closest("[hidden]") || focused.matches(":disabled") ? fallback : focused;
			if (document.activeElement !== destination) destination.focus({ preventScroll: true });
			else if (destination.matches("tr[data-op]") && !pointer) openTip(destination);
		}
	}
	previous.addEventListener("click", () => show(current - 1));
	next.addEventListener("click", () => show(current + 1));
	dots.forEach((dot) => dot.addEventListener("click", () => show(Number(dot.dataset.goto))));
	subDots.forEach((dot) => dot.addEventListener("click", () => show(Number(dot.dataset.subgoto))));
	root.addEventListener("keydown", (event) => {
		if (event.target.closest("pre, [data-zx], details")) return;
		if (event.key === "Escape") closeTip();
		else if (event.key === "ArrowRight") show(current + 1);
		else if (event.key === "ArrowLeft") show(current - 1);
	});
});

</script>
<script>
  // Report the page height to the notebook, which sizes the iframe to fit each step.
  new ResizeObserver(() =>
    parent.postMessage({ tcsHeight: document.documentElement.scrollHeight }, '*'),
  ).observe(document.body);
</script>
