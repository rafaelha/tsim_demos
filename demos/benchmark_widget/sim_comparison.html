<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
/* Light-mode tokens of bloqade-website's src/styles/brand.css */
:root {
  --color-bg: #ffffff; --color-fg: #1a1b22; --color-muted: #55596b; --color-border: #e6e6ef;
  --color-surface: #f7f7fb; --color-surface-hover: #f0eefb;
  --brand: #6437ff; --brand-strong: #4f27d6; --brand-soft: #efeaff; --on-brand: #ffffff;
  --viz-series-1: #6437ff; --viz-series-2: #eb6834; --viz-series-3: #1baf7a;
  --viz-series-4: #eda100; --viz-series-5: #d81b7a;
}
html, body { margin: 0; background: #ffffff; }
body {
  padding: 4px;
  font-family: 'Lato', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: var(--color-fg);
}
/* bloqade-website src/components/TsimBenchmarks.css */
/*
 * Tsim 1.0.0 release-post figures: TsimReleaseBenchmarks, TsimSimulatorComparison
 * and TsimActiveWidthTable share this sheet, so their cards, toggles, rows and
 * tooltips read as one set.
 *
 * Colour comes from the canonical `--viz-series-*` slots in brand.css, fixed
 * per simulator (Tsim 1.0.0 = slot 1, Clifft = 2, SymFT = 3; Tsim 0.1.5 is the
 * muted "before" ring). Everything else derives from the shared tokens, so
 * light and dark flip automatically.
 *
 * Paragraph, list and link rules are scoped under `.tsb`: the blog wrapper's
 * `.prose p` / `.prose ul` outrank a single class and would otherwise impose
 * the prose rhythm on the figure chrome.
 */
.tsb {
  --tsb-grid: color-mix(in srgb, var(--color-border) 80%, transparent);
  --tsb-inset: 7px;

  margin: 1.75rem 0 2rem;
  padding: clamp(1rem, 3vw, 1.6rem);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  background: var(--color-surface);
  color: var(--color-fg);
}

/* Series slots: one place per slot, consumed by marks, legend and tooltip keys. */
.tsb__s0 {
  --tsb-color: var(--color-muted);
}
.tsb__s1 {
  --tsb-color: var(--viz-series-1);
}
.tsb__s2 {
  --tsb-color: var(--viz-series-2);
}
.tsb__s3 {
  --tsb-color: var(--viz-series-3);
}
.tsb__s4 {
  --tsb-color: var(--viz-series-4);
}

.tsb__sr {
  position: absolute;
  overflow: hidden;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* --- Caption -------------------------------------------------------------- */
.tsb__caption {
  margin-bottom: 0.9rem;
}
.tsb .tsb__eyebrow {
  margin: 0 0 0.3rem;
  color: var(--color-muted);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tsb .tsb__title {
  margin: 0 0 0.45rem;
  font-size: clamp(1.15rem, 3vw, 1.4rem);
  font-weight: 900;
  line-height: 1.25;
}
.tsb .tsb__sub {
  margin: 0;
  max-width: 46rem;
  color: var(--color-muted);
  font-size: 0.86rem;
  line-height: 1.55;
}
.tsb .tsb__sub + .tsb__sub {
  margin-top: 0.45rem;
}
.tsb__sub strong {
  color: var(--color-fg);
}
/* The caveat that has to travel with the plot, set a step quieter. */
.tsb .tsb__sub--caveat {
  margin-top: 0.6rem;
  border-left: 2px solid var(--color-border);
  padding-left: 0.6rem;
  font-size: 0.78rem;
}
.tsb code {
  font-size: 0.9em;
}

/* --- Legend --------------------------------------------------------------- */
.tsb .tsb__legend {
  display: flex;
  margin: 0 0 0.75rem;
  padding: 0;
  flex-wrap: wrap;
  gap: 0.35rem 1.2rem;
  list-style: none;
}
.tsb .tsb__legend-item {
  display: flex;
  align-items: center;
  margin: 0;
  gap: 0.4rem;
  color: var(--color-fg);
  font-size: 0.8rem;
  font-weight: 700;
}
/* Comparison legend: each entry shows or hides its simulator. */
.tsb .tsb__legend-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.1rem 0.35rem;
  margin: -0.1rem -0.35rem;
  border: 0;
  border-radius: 4px;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.tsb .tsb__legend-toggle:hover {
  background: var(--color-surface-hover);
}
.tsb .tsb__legend-toggle[aria-pressed='false'] {
  opacity: 0.45;
}
.tsb .tsb__legend-toggle[aria-pressed='false'] span {
  text-decoration: line-through;
}
.tsb__glyph {
  width: 0.8rem;
  height: 0.8rem;
  flex: none;
  overflow: visible;
}
.tsb__glyph path,
.tsb__mark path {
  fill: var(--tsb-color);
  stroke: var(--color-surface);
  stroke-width: 1.5;
}
/* Tsim 0.1.5: hollow, so "before" never rests on the grey alone. */
.tsb__ring path {
  fill: var(--color-surface);
  stroke: var(--tsb-color);
  stroke-width: 2;
}

/* --- Segmented toggles ----------------------------------------------------- */
.tsb__controls {
  display: flex;
  margin: 0 0 0.85rem;
  flex-wrap: wrap;
  gap: 0.6rem 1.1rem;
}
.tsb__control {
  display: grid;
  gap: 0.3rem;
  justify-items: start;
}
.tsb__control-label {
  color: var(--color-muted);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.tsb__segments {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--color-border);
  border-radius: 9px;
  background: var(--color-bg);
}
.tsb__segments button {
  padding: 0.32rem 0.75rem;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--color-muted);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1.3;
  cursor: pointer;
}
.tsb__segments button:hover {
  color: var(--brand-strong);
}
.tsb__segments button[aria-pressed='true'] {
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent);
  color: var(--brand-strong);
}
.tsb__segments button:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 1px;
}

/* What the axis currently shows; doubles as the plot's running caption. */
.tsb .tsb__note {
  margin: 0 0 0.35rem;
  color: var(--color-muted);
  font-size: 0.76rem;
  line-height: 1.45;
}

/* --- Row chart -------------------------------------------------------------
 * One row per circuit on a shared, decade-aligned log axis. Decades are evenly
 * spaced, so the grid is one repeating gradient sized by `--decades`, inset by
 * `--tsb-inset` so a mark at either end of the axis is never clipped. */
.tsb__chart {
  --decades: 4;
}
.tsb__head,
.tsb__row {
  display: grid;
  align-items: center;
  column-gap: 0.65rem;
  grid-template-areas: 'name plot value';
  grid-template-columns: 11rem minmax(0, 1fr) 8.8rem;
}
.tsb--compare .tsb__head,
.tsb--compare .tsb__row {
  grid-template-areas: 'name k plot value';
  grid-template-columns: 11rem 1.5rem minmax(0, 1fr) 4.4rem;
}
.tsb__head {
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.7rem;
  font-weight: 700;
}
.tsb__head-name {
  grid-area: name;
}
.tsb__head-k {
  grid-area: k;
  text-align: right;
}
.tsb__head-unit {
  grid-area: value;
  text-align: right;
}
.tsb__ticks {
  position: relative;
  grid-area: plot;
  height: 1.1rem;
  margin-inline: var(--tsb-inset);
  font-variant-numeric: tabular-nums;
  font-weight: 400;
}
.tsb__tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  white-space: nowrap;
}
.tsb__tick:first-child {
  transform: translateX(calc(-1 * var(--tsb-inset)));
}
.tsb__tick:last-child {
  transform: translateX(calc(-100% + var(--tsb-inset)));
}

.tsb__row {
  border-bottom: 1px solid var(--color-border);
}
.tsb__name {
  display: grid;
  grid-area: name;
  min-width: 0;
  padding: 0.5rem 0;
  gap: 0.1rem;
}
.tsb .tsb__name a,
.tsb__name-text {
  color: var(--color-fg);
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.3;
  text-decoration-color: color-mix(in srgb, var(--brand) 55%, transparent);
  text-underline-offset: 3px;
}
.tsb .tsb__name a:hover {
  color: var(--brand-strong);
}
.tsb .tsb__name a:focus-visible {
  border-radius: 3px;
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
.tsb__meta {
  color: var(--color-muted);
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
}
.tsb__tag {
  margin-left: 0.35rem;
  padding: 0 0.35rem;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  white-space: nowrap;
}
.tsb__tag[hidden] {
  display: none;
}

.tsb__plot {
  display: grid;
  position: relative;
  grid-area: plot;
  align-content: center;
  align-self: stretch;
  padding: 0.55rem 0;
  gap: 3px;
  border-radius: 4px;
  background-image: linear-gradient(to right, var(--tsb-grid) 1px, transparent 1px);
  background-position: var(--tsb-inset) 0;
  background-repeat: repeat-x;
  background-size: calc((100% - 2 * var(--tsb-inset)) / var(--decades)) 100%;
  cursor: default;
}
.tsb__plot.is-active {
  background-color: var(--color-surface-hover);
}
.tsb__plot:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
/* Relative view: the 1× reference is the left edge, drawn a step stronger. */
.tsb--compare[data-view='relative'] .tsb__plot::before {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--tsb-inset);
  width: 1px;
  background: color-mix(in srgb, var(--color-muted) 70%, transparent);
  content: '';
}

.tsb__lane {
  position: relative;
  height: 15px;
  margin-inline: var(--tsb-inset);
}
.tsb__stem {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--x);
  height: 2px;
  margin-top: -1px;
  border-radius: 1px;
  background: color-mix(in srgb, var(--tsb-color) 50%, transparent);
}
.tsb__mark {
  position: absolute;
  top: 50%;
  left: var(--x);
  width: 12px;
  height: 12px;
  overflow: visible;
  transform: translate(-50%, -50%);
}
.tsb__lane:not([data-kind='ok']) .tsb__stem,
.tsb__lane:not([data-kind='ok']) .tsb__mark {
  display: none;
}
.tsb__row[hidden],
.tsb--compare[data-metric='compile'] [data-sampling-only],
.tsb--bars[data-metric='compile'] [data-sampling-only] {
  display: none;
}
.tsb__lane[hidden],
.tsb__ks [hidden],
.tsb__values [hidden] {
  display: none;
}
.tsb .tsb__more {
  margin: 0.6rem 0 0;
  padding: 0.35rem 0;
  border: 0;
  background: none;
  color: var(--brand-strong);
  cursor: pointer;
  font: inherit;
  font-size: 0.84rem;
  font-weight: 700;
}
.tsb .tsb__more:hover {
  text-decoration: underline;
}
.tsb .tsb__more:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

/* Compare: the stem spans baseline → target and the open mark is the baseline. */
.tsb__lane .tsb__mark--base {
  left: var(--from);
}
.tsb__lane:not([data-compare]) .tsb__mark--base {
  display: none;
}
.tsb__lane[data-compare] .tsb__stem {
  left: min(var(--from), var(--x));
  width: calc(max(var(--from), var(--x)) - min(var(--from), var(--x)));
}

/* K column and value column: one line per lane, aligned with the lanes. */
.tsb__ks,
.tsb__values {
  display: grid;
  align-content: center;
  gap: 3px;
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.tsb__ks {
  grid-area: k;
  color: var(--color-muted);
}
.tsb__values {
  grid-area: value;
  color: var(--color-muted);
}
.tsb__ks span,
.tsb__values span {
  height: 15px;
  line-height: 15px;
  white-space: nowrap;
}
/* The fastest engine in a row carries the ink; the rest stay secondary. */
.tsb__values .is-best {
  color: var(--color-fg);
  font-weight: 900;
}
.tsb__values [data-kind='pending'],
.tsb__values [data-kind='na'],
.tsb__readout [data-kind='pending'],
.tsb__readout [data-kind='na'] {
  font-style: italic;
}

/* --- Lanes on one circuit (TsimStimComparison) --------------------------------
 * The comparison's line-and-mark lanes, one row per simulator. Stim's line is
 * dashed: it samples a Clifford proxy, not the measured circuit. */
.tsb--bars .tsb__head,
.tsb--bars .tsb__row {
  grid-template-columns: 13.5rem minmax(0, 1fr) 4.4rem;
}
.tsb--bars .tsb__note-title {
  margin-right: 0.45rem;
  color: var(--color-fg);
  font-weight: 700;
  text-decoration-color: color-mix(in srgb, var(--brand) 55%, transparent);
  text-underline-offset: 3px;
}
.tsb--bars a.tsb__note-title:hover {
  color: var(--brand-strong);
}
.tsb--bars a.tsb__note-title:focus-visible {
  border-radius: 3px;
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
.tsb__name-engine {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
/* A simulator that cannot run the setting keeps its row, labelled in the lane. */
.tsb__lane-note {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  color: var(--color-muted);
  font-size: 0.72rem;
  font-style: italic;
  white-space: nowrap;
}
.tsb__lane:not([data-kind='na']) .tsb__lane-note {
  display: none;
}
.tsb__stem--proxy {
  background: repeating-linear-gradient(
    to right,
    color-mix(in srgb, var(--tsb-color) 70%, transparent) 0 5px,
    transparent 5px 9px
  );
}

/* --- Release dumbbells ----------------------------------------------------- */
.tsb__lane--dumbbell {
  height: 22px;
}
.tsb__span {
  position: absolute;
  top: 50%;
  left: var(--from);
  width: calc(var(--to) - var(--from));
  height: 2px;
  margin-top: -1px;
  background: color-mix(in srgb, var(--viz-series-1) 55%, transparent);
}
.tsb__lane--dumbbell .tsb__mark {
  width: 14px;
  height: 14px;
}
.tsb__readout {
  display: grid;
  grid-area: value;
  justify-items: end;
  padding: 0.45rem 0;
  gap: 0.05rem;
  text-align: right;
}
.tsb__speedup {
  font-size: 1.25rem;
  font-weight: 900;
  line-height: 1.15;
  white-space: nowrap;
}
.tsb__speedup[data-kind='pending'],
.tsb__speedup[data-kind='na'] {
  color: var(--color-muted);
  font-size: 0.9rem;
}
.tsb__speedup-note,
.tsb__from-to {
  color: var(--color-muted);
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.35;
}

.tsb__panel[hidden] {
  display: none;
}

/* --- Tooltip -------------------------------------------------------------- */
.tsb__tip {
  position: fixed;
  z-index: 60;
  width: max-content;
  max-width: min(23rem, calc(100vw - 1rem));
  padding: 0.6rem 0.75rem 0.65rem;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-bg);
  box-shadow: 0 16px 36px -18px rgb(0 0 0 / 55%);
  color: var(--color-fg);
  font-size: 0.76rem;
  line-height: 1.45;
  pointer-events: none;
}
.tsb__tip[hidden] {
  display: none;
}
.tsb .tsb__tip p {
  margin: 0;
}
.tsb .tsb__tip-title {
  font-size: 0.82rem;
  font-weight: 900;
}
.tsb .tsb__tip-meta {
  color: var(--color-muted);
  font-size: 0.72rem;
}
.tsb__tip-item {
  margin-top: 0.45rem;
}
.tsb__tip-head {
  display: grid;
  align-items: center;
  gap: 0.45rem;
  grid-template-columns: 0.8rem minmax(0, 1fr) auto;
}
.tsb__tip-name {
  color: var(--color-muted);
  font-weight: 700;
}
/* Values lead in the tooltip: the reader has the series, wants the number. */
.tsb__tip-value {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
}
.tsb .tsb__tip-notes {
  padding-left: 1.25rem;
  color: var(--color-muted);
  font-size: 0.72rem;
}
.tsb .tsb__tip-foot {
  margin-top: 0.45rem;
  border-top: 1px solid var(--color-border);
  padding-top: 0.35rem;
  color: var(--color-muted);
  font-size: 0.72rem;
}

/* --- Disclosures + tables -------------------------------------------------- */
.tsb__details,
.tsb__table {
  margin-top: 1rem;
  border-top: 1px solid var(--color-border);
  padding-top: 0.75rem;
}
.tsb__table {
  margin-top: 0.75rem;
}
.tsb__details > summary,
.tsb__table > summary {
  color: var(--brand-strong);
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 700;
}
.tsb__details > summary:focus-visible,
.tsb__table > summary:focus-visible {
  border-radius: 3px;
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
.tsb__specs {
  display: grid;
  margin: 0.85rem 0 0;
  gap: 0.1rem 1rem;
  grid-template-columns: 9rem minmax(0, 1fr);
  font-size: 0.78rem;
  line-height: 1.55;
}
.tsb__specs dt {
  color: var(--color-fg);
  font-weight: 700;
}
.tsb__specs dd {
  margin: 0 0 0.5rem;
  color: var(--color-muted);
}
.tsb__scroll {
  overflow-x: auto;
}
.tsb table {
  width: 100%;
  margin: 0.85rem 0 0;
  border-collapse: collapse;
  font-size: 0.76rem;
}
.tsb caption {
  margin-bottom: 0.3rem;
  color: var(--color-muted);
  font-size: 0.72rem;
  font-weight: 700;
  text-align: left;
}
.tsb th,
.tsb td {
  border-bottom: 1px solid var(--color-border);
  padding: 0.3rem 0.45rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.tsb thead th {
  color: var(--color-muted);
  font-weight: 700;
  vertical-align: bottom;
}
.tsb tbody th {
  color: var(--color-fg);
  text-align: left;
}
.tsb th[scope='colgroup'] {
  text-align: center;
}
.tsb td[data-kind='na'],
.tsb td[data-kind='pending'] {
  color: var(--color-muted);
  font-style: italic;
}

/* --- K table ---------------------------------------------------------------- */
.tsb--width table {
  margin-top: 0;
  font-size: 0.84rem;
}
.tsb--width thead th {
  white-space: nowrap;
}
.tsb--width thead th:first-child {
  text-align: left;
}
/* "Active width K" spans the three engine columns. */
.tsb .tsb__group-row td {
  border-bottom: 0;
}
.tsb .tsb__group-row th {
  padding-bottom: 0.15rem;
  color: var(--color-fg);
  text-align: center;
}
.tsb__th-engine {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.tsb__k {
  display: inline-block;
  min-width: 2.2rem;
  padding: 0.05rem 0.4rem;
  border-radius: 6px;
  text-align: center;
}
.tsb__k--none {
  color: var(--color-muted);
}
/* The lowest K per row is bold. */
.tsb__k--lowest {
  color: var(--color-fg);
  font-weight: 900;
}
.tsb .tsb__empty {
  margin: 0;
  color: var(--color-muted);
  font-size: 0.84rem;
}

@media (prefers-reduced-motion: no-preference) {
  .tsb__mark {
    transition: left 0.3s ease;
  }
  .tsb__stem {
    transition:
      left 0.3s ease,
      width 0.3s ease;
  }
}

/* Touch: segment buttons, legend toggles and disclosure summaries reach the 44px
 * minimum, and circuit links grow their hit box without moving a glyph (block
 * padding cancelled by an equal negative margin). Same break the other blog
 * figures use. */
@media (max-width: 50rem) {
  .tsb__segments button {
    min-height: 2.75rem;
    padding-inline: 0.9rem;
  }
  .tsb .tsb__legend {
    row-gap: 0;
  }
  .tsb .tsb__legend-toggle {
    min-height: 2.75rem;
    margin-block: 0;
  }
  .tsb__details > summary,
  .tsb__table > summary {
    min-height: 2.75rem;
    padding: 0.75rem 0;
  }
  .tsb .tsb__name a,
  .tsb--width tbody th a {
    display: inline-block;
    margin-block: -0.85rem;
    padding-block: 0.85rem;
  }
}

/* Narrow cards: the circuit name takes its own line above the plot, so the axis
 * keeps most of the width. Keyed to the chart's own width (a container query on
 * `.tsb__chart`, not on `.tsb`: layout containment there would turn the card into
 * the fixed-position tooltip's containing block). Every other tick label drops
 * wherever the plot column gets too narrow for all of them. */
.tsb__chart {
  container-type: inline-size;
}
@container (max-width: 34rem) {
  .tsb__head,
  .tsb__row {
    grid-template-areas:
      'name name'
      'plot value';
    grid-template-columns: minmax(0, 1fr) 7rem;
  }
  .tsb__speedup {
    font-size: 1.05rem;
  }
  .tsb--compare .tsb__head,
  .tsb--compare .tsb__row {
    grid-template-areas:
      'name name name'
      'k plot value';
    grid-template-columns: 1.3rem minmax(0, 1fr) 4rem;
    column-gap: 0.45rem;
  }
  .tsb--bars .tsb__head,
  .tsb--bars .tsb__row {
    grid-template-columns: minmax(0, 1fr) 4rem;
  }
  .tsb__head-name {
    display: none;
  }
  .tsb__name {
    padding-bottom: 0;
  }
  .tsb__plot {
    padding-top: 0.35rem;
  }
}
@container (max-width: 30rem) {
  .tsb__tick--minor {
    display: none;
  }
}
@container (min-width: 34rem) and (max-width: 42rem) {
  .tsb__tick--minor {
    display: none;
  }
}

/* Phones: small text steps up to the 12px floor. */
@media (max-width: 40rem) {
  .tsb .tsb__eyebrow,
  .tsb code,
  .tsb__head,
  .tsb__meta,
  .tsb__ks,
  .tsb__values,
  .tsb__speedup-note,
  .tsb__from-to,
  .tsb__control-label,
  .tsb .tsb__tip-meta,
  .tsb .tsb__tip-notes,
  .tsb .tsb__tip-foot,
  .tsb table,
  .tsb caption {
    font-size: 0.75rem;
  }
  .tsb__specs {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  .tsb__specs dt {
    margin-top: 0.5rem;
  }
  /* The K table keeps all five columns on a phone: engine names wrap under
   * their marker instead of pushing the last column into a scroller. */
  .tsb--width thead th {
    white-space: normal;
  }
  .tsb__th-engine {
    display: inline-grid;
    justify-items: end;
    gap: 0.15rem;
  }
  .tsb--width th,
  .tsb--width td {
    padding-inline: 0.3rem;
  }
}

/* Additions for this widget */
.tsb { margin: 0; }
.tsb__control[hidden] { display: none; }
.tsb__controls--view { margin-top: -0.35rem; }
.tsb__stem--dotted {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 80%, transparent) 0 2px, transparent 2px 5px);
}
.tsb__legend-line { display: inline-block; width: 16px; height: 2px; margin-right: -0.15rem; vertical-align: middle; }
.tsb__legend-line[data-line='solid'] { background: color-mix(in srgb, var(--tsb-color) 60%, transparent); }
.tsb__legend-line[data-line='dashed'] {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 70%, transparent) 0 5px, transparent 5px 8px);
}
.tsb__legend-line[data-line='dotted'] {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 80%, transparent) 0 2px, transparent 2px 4px);
}
.tsb__ks .is-inferred { font-style: italic; opacity: 0.75; }
.tsb__s5 { --tsb-color: var(--viz-series-5); }
.tsb--compare .tsb__head, .tsb--compare .tsb__row {
  grid-template-columns: 13rem 1.6rem minmax(0, 1fr) 4.6rem;
}
.tsb__lane-note { left: 0; }
.tsb__glyph path, .tsb__mark path { fill: var(--tsb-color); }
.tsb__mark.tsb__ring path, .tsb .tsb__mark.tsb__ring path { fill: var(--color-surface); stroke: var(--tsb-color); stroke-width: 1.5px; }
</style>

ion detectors in cultivation). Shots discarded by postselection count as attempted shots, so the rate is a cost per attempt; the tooltip shows the fraction kept. Off: every shot is sampled to the end."], ["Compilation", "Wall time from circuit text to a sampler ready to sample, excluding imports and first-call JIT."], ["Threads", "1 thread: pinned to one core with every thread pool capped at 1. 12: each simulator's own thread option set to all physical cores. GPU lanes do not depend on this setting."], ["Failures", "Each measurement has a 300 s budget (compilation, warm-up and sampling) and a memory cap. 'too wide': Tsim's GPU kernels support K \u2264 11 and its CPU statevector K \u2264 30. 'no rotations': the simulator has no arbitrary-angle rotations."], ["Magna", "Magna does not sample detectors: each draw of the faults gives the exact accepted probability and the probability that an observable flips. Its rate is draws per second, a different unit of work from the other simulators' shots per second. Magna has no thread option; its all-core lane is 12 processes. Circuits are converted to Magna's format by a script; Magna's kept fraction and error rate agree with Tsim's within 5 standard errors on every circuit."], ["Output", "Each simulator ran its fastest documented output contract: Tsim and xtim return bit-packed detector and observable rows; Clifft and SymFT return survivor counts with postselection on (SymFT can only postselect all detectors or none). Hover a lane for the contract used."], ["Checks", "Every simulator's detection, observable and kept rates agree with a separate Tsim run (or xtim / Magna where Tsim cannot run) within 5 standard errors."], ["Views", "One row per circuit, one lane per simulator, on a shared log axis. Lines show the device: solid for CPUs, dashed for the Apple GPU, dotted for the RTX 5090. Relative puts each row's slowest simulator at 1\u00d7 (for compilation, the slowest to compile). Compare draws each lane from its baseline (open mark: postselection off, or 1 thread) to the selected setting (filled mark) and gives the speedup."], ["K", "The most qubits held in a dense statevector at once, as each simulator reports it. Sampling cost grows as 2^K. Italic: a run that failed, with the width the simulator reported in its other runs of the circuit, in tsim-bench, or in its error."], ["Versions", "tsim-cpu-1t: bloqade-tsim 1.1.0, branch feat/determined-measurements @ 0e95b9a37a808053df6f09ba3887ce9eaf24c18a (https://github.com/QuEraComputing/tsim) \u00b7 tsim-cuda: bloqade-tsim 1.1.0, branch cuda-statevector-executor (PR #219) @ d140f3d98ae2cedf0a916e77933bc127245489ab, cupy-cuda13x 14.2.0 \u00b7 clifft-1t: clifft 0.13.0 (PyPI) \u00b7 symft-1t: symft 2026.10.8 (PyPI wheel; = SOFT release v0.1.0 @ 81d28499, github.com/haoliri0/SOFT) \u00b7 xtim-1t: xtim 4.1.2 @ b6dc0302604c4faf59a7b753004fddb42cb8d615 (github.com/ikim-quantum/xtim, built from source) \u00b7 magna-1t: magna-quantum 0.2.0 @ e466ec60644656169878f28f4788d9a3cbf05bab (github.com/itpyi/magna, built from source) \u00b7 magna-cuda: magna-quantum 0.2.0 @ e466ec6 with cuda12 extra, cupy-cuda12x 14.2.0 (NVRTC kernels compiled at first call) \u00b7 tsim-metal: bloqade-tsim 1.1.0"], ["Circuits", "From tsim-bench (github.com/rafaelha/tsim-bench); each name links to the circuit and its paper folder."]]}</script>
<script>
(() => {
  const root = document.querySelector('[data-sim]');
  const data = JSON.parse(document.querySelector('[data-model]').textContent);
  const state = { mode: 'all', metric: 'sampling', threads: '1t', post: 'on', view: 'absolute' };
  const hidden = new Set();

  const MARKERS = {
    square: 'M-3.6 -3.6h7.2v7.2h-7.2Z',
    triangle: 'M0 -4.9L4.5 3.2L-4.5 3.2Z',
    diamond: 'M0 -5L4.7 0L0 5L-4.7 0Z',
    cross: 'M-5.4 -2.4h3v-3h4.8v3h3v4.8h-3v3h-4.8v-3h-3Z',
    circle: 'M-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0Z',
  };
  const svgNS = 'http://www.w3.org/2000/svg';
  const glyph = (engine, className = 'tsb__glyph') => {
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', className);
    svg.setAttribute('viewBox', '-6 -6 12 12');
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', MARKERS[engine.shape]);
    svg.append(path);
    return svg;
  };
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const sig = (v) => Number(v.toPrecision(3));
  const rate = (v) => v >= 1e9 ? `${sig(v / 1e9)} B` : v >= 1e6 ? `${sig(v / 1e6)} M` : v >= 1e3 ? `${sig(v / 1e3)} k` : `${sig(v)}`;
  const secs = (v) => v >= 1 ? `${sig(v)} s` : `${sig(v * 1e3)} ms`;
  const ratio = (v) => v >= 1e4 ? `${rate(v).replace(' ', '')}×` : v >= 100 ? `${Math.round(v).toLocaleString('en-US')}×` : `${sig(v)}×`;
  const fmt = (v) => state.metric === 'sampling' ? rate(v) : secs(v);

  const compare = () => state.metric === 'sampling' ? (state.threads === 'compare' ? 'threads' : state.post === 'compare' ? 'post' : null) : null;
  const engines = () => data.modes[state.mode].map((id) => data.engines[id]);
  const cellOf = (circuit, engine, threads, post) => {
    const config = engine.configs[engine.configs.length === 1 ? 0 : threads === 'mt' ? 1 : 0];
    return (data.cells[circuit.id] || {})[post === 'off' ? `${config}|post-off` : config];
  };
  const valueOf = (c) => (!c || c.error ? null : state.metric === 'sampling' ? c.shots_per_s : c.compile_s);
  /** The target setting (filled mark) and, when comparing, the baseline (open mark). */
  const target = () => ({ threads: state.threads === 'compare' ? 'mt' : state.threads, post: state.post === 'compare' ? 'on' : state.post });
  const baseline = () => compare() === 'threads' ? { ...target(), threads: '1t' } : compare() === 'post' ? { ...target(), post: 'off' } : null;

  const SETTINGS = [];
  ['1t', 'mt'].forEach((threads) => ['on', 'off'].forEach((post) => SETTINGS.push({ threads, post })));

  /** Relative: each row's slowest engine at 1× (for compile time, the slowest to compile). */
  function relatives(circuit, shown, setting) {
    const vals = shown.map((engine) => valueOf(cellOf(circuit, engine, setting.threads, setting.post)));
    const ok = vals.filter((v) => v !== null && v > 0);
    if (!ok.length) return vals.map(() => null);
    const ref = state.metric === 'sampling' ? Math.min(...ok) : Math.max(...ok);
    return vals.map((v) => (v === null || v <= 0 ? null : state.metric === 'sampling' ? v / ref : ref / v));
  }

  /* One axis per mode, metric and view, over every thread and postselection setting, so that
     toggling a setting moves marks, never the scale. */
  function axis(shown) {
    const values = [];
    data.circuits.forEach((circuit) =>
      SETTINGS.forEach((setting) => {
        if (state.view === 'relative' && !compare()) values.push(...relatives(circuit, shown, setting).filter((v) => v));
        else shown.forEach((engine) => {
          const v = valueOf(cellOf(circuit, engine, setting.threads, setting.post));
          if (v && v > 0) values.push(v);
        });
      }),
    );
    if (!values.length) return { lo: 0, hi: 1 };
    let lo = state.view === 'relative' && !compare() ? 0 : Math.floor(Math.log10(Math.min(...values)));
    let hi = Math.ceil(Math.log10(Math.max(...values)));
    if (hi - lo < 1) hi = lo + 1;
    return { lo, hi };
  }
  const position = (v, ax) => ((Math.log10(v) - ax.lo) / (ax.hi - ax.lo)) * 100;

  function shortError(error) {
    if (/timeout/i.test(error)) return 'timeout';
    if (/memory|OOM/i.test(error)) return 'out of memory';
    if (/k_max|active width|active qubits|too wide|too large|> ?11|limit/i.test(error)) return 'too wide';
    if (/rotation/i.test(error)) return 'no rotations';
    if (/unsupported/i.test(error)) return 'unsupported';
    if (/setup/i.test(error)) return 'not installed';
    return 'error';
  }

  function legend() {
    const host = root.querySelector('[data-legend]');
    host.replaceChildren(
      ...engines().map((engine) => {
        const item = el('li', `tsb__legend-item tsb__s${engine.slot}`);
        const button = el('button', 'tsb__legend-toggle');
        button.type = 'button';
        button.setAttribute('aria-pressed', String(!hidden.has(engine.id)));
        const line = el('span', 'tsb__legend-line');
        line.dataset.line = engine.line;
        button.append(line, glyph(engine), el('span', '', engine.label));
        button.addEventListener('click', () => {
          if (hidden.has(engine.id)) hidden.delete(engine.id);
          else if (engines().filter((e) => !hidden.has(e.id)).length > 1) hidden.add(engine.id);
          render();
        });
        item.append(button);
        return item;
      }),
    );
  }

  const LABELS = { threads: { '1t': '1 thread', mt: `${data.cores} threads` }, post: { on: 'postselection on', off: 'postselection off' } };

  function render() {
    const shown = engines().filter((engine) => !hidden.has(engine.id));
    const cmp = compare();
    const relative = state.view === 'relative' && !cmp;
    const ax = axis(shown);
    const tgt = target();
    const base = baseline();

    root.dataset.metric = state.metric;
    root.dataset.view = relative ? 'relative' : 'absolute';
    root.querySelector('[data-threads-control]').hidden = state.metric === 'compile' || state.mode === 'tsim';
    root.querySelector('[data-sampling-control]').hidden = state.metric === 'compile';
    root.querySelector('[data-view-control]').hidden = !!cmp;
    root.querySelectorAll('[data-setting]').forEach((group) =>
      group.querySelectorAll('button').forEach((button) =>
        button.setAttribute('aria-pressed', String(button.dataset.value === state[group.dataset.setting])),
      ),
    );
    const note = root.querySelector('[data-note]');
    note.textContent = cmp
      ? `Each lane runs from ${LABELS[cmp][base[cmp]]} (open mark) to ${LABELS[cmp][tgt[cmp]]} (filled mark); the value is how many times faster.`
      : relative
        ? state.metric === 'sampling' ? 'Each row puts its slowest simulator at 1×.' : 'Each row puts the simulator slowest to compile at 1×.'
        : '';
    note.hidden = !note.textContent;
    legend();

    const chart = root.querySelector('[data-chart]');
    chart.style.setProperty('--decades', String(ax.hi - ax.lo));
    root.querySelector('[data-unit]').textContent = relative ? (state.metric === 'sampling' ? 'vs slowest' : 'vs slowest') : cmp ? 'speedup' : state.metric === 'sampling' ? 'shots/s' : 'compile';
    const ticks = [];
    const step = ax.hi - ax.lo > 8 ? 2 : 1;
    for (let d = ax.lo; d <= ax.hi; d += step) {
      const label = relative ? ratio(10 ** d) : state.metric === 'sampling' ? rate(10 ** d).replace(' ', '') : secs(10 ** d);
      const tick = el('span', 'tsb__tick', label);
      tick.style.left = `${position(10 ** d, ax)}%`;
      ticks.push(tick);
    }
    root.querySelector('[data-ticks]').replaceChildren(...ticks);

    const rows = data.circuits.map((circuit) => {
      const cells = shown.map((engine) => cellOf(circuit, engine, tgt.threads, tgt.post));
      const bases = shown.map((engine) => (base ? cellOf(circuit, engine, base.threads, base.post) : null));
      const abs = cells.map(valueOf);
      const rel = relative ? relatives(circuit, shown, tgt) : null;
      const plotted = relative ? rel : abs;
      const ok = plotted.filter((v) => v !== null);
      const best = ok.length ? (relative || state.metric === 'sampling' ? Math.max(...ok) : Math.min(...ok)) : null;
      const tsim1 = state.metric === 'sampling' ? valueOf(cellOf(circuit, data.engines['tsim-1t'], '1t', tgt.post)) : null;

      const row = el('div', 'tsb__row');
      const name = el('div', 'tsb__name');
      const link = el('a', '', circuit.label);
      link.href = circuit.url;
      link.target = '_blank';
      name.append(link, el('span', 'tsb__meta', circuit.meta));
      const ks = el('div', 'tsb__ks');
      const plot = el('div', 'tsb__plot');
      const vals = el('div', 'tsb__values');
      const tip = { title: circuit.label, meta: [circuit.meta, circuit.paper], items: [] };

      shown.forEach((engine, i) => {
        const c = cells[i];
        const v = plotted[i];
        const b = bases[i];
        const bv = base && b && b !== c ? valueOf(b) : null;

        const k = c && !c.error && c.k_max !== null && c.k_max !== undefined ? String(c.k_max) : c && c.k_inferred ? c.k_inferred : '';
        const kSpan = el('span', c && c.error && c.k_inferred ? 'is-inferred' : '', k);
        if (c && (c.k_source || c.k_name)) kSpan.title = c.error ? `K ${c.k_source}` : c.k_name;
        ks.append(kSpan);

        const lane = el('div', `tsb__lane tsb__s${engine.slot}`);
        lane.dataset.kind = v === null ? 'na' : 'ok';
        if (v !== null) {
          lane.style.setProperty('--x', `${position(v, ax)}%`);
          const stem = el('span', `tsb__stem${engine.line === 'dashed' ? ' tsb__stem--proxy' : engine.line === 'dotted' ? ' tsb__stem--dotted' : ''}`);
          lane.append(stem);
          if (bv !== null) {
            lane.dataset.compare = '';
            lane.style.setProperty('--from', `${position(bv, ax)}%`);
            lane.append(glyph(engine, 'tsb__mark tsb__mark--base tsb__ring'));
          }
          lane.append(glyph(engine, 'tsb__mark'));
        } else {
          lane.append(el('span', 'tsb__lane-note', c ? shortError(c.error || '') : 'not run'));
        }
        plot.append(lane);

        let text = '–';
        if (v !== null) text = cmp ? (bv !== null ? ratio(abs[i] / bv) : '') : relative ? ratio(v) : fmt(v);
        const span = el('span', !cmp && v !== null && v === best ? 'is-best' : '', text);
        span.dataset.kind = v === null ? 'na' : 'ok';
        vals.append(span);

        const notes = [];
        if (c && !c.error) {
          if (cmp && bv !== null) notes.push(`${LABELS[cmp][base[cmp]]}: ${fmt(bv)} → ${LABELS[cmp][tgt[cmp]]}: ${fmt(abs[i])}`);
          if (relative) notes.push(state.metric === 'sampling' ? `${rate(abs[i])} shots/s` : `compile ${secs(abs[i])}`);
          if (state.metric === 'sampling') notes.push(`compile ${secs(c.compile_s)}`);
          else notes.push(`${rate(c.shots_per_s)} shots/s`);
          if (k) notes.push(`K = ${k}`);
          if (state.metric === 'sampling' && typeof c.kept === 'number' && tgt.post === 'on') notes.push(`${sig(c.kept * 100)}% kept`);
          if (c.threads) notes.push(`${c.threads} thread${c.threads === 1 ? '' : 's'}`);
          if (tsim1 && abs[i] && state.metric === 'sampling' && engine.id !== 'tsim-1t') notes.push(`${ratio(abs[i] / tsim1)} Tsim CPU, 1 thread`);
          if (c.post_note) notes.push(c.post_note);
          if (c.note) notes.push(c.note);
          if (c.suspect) notes.push('suspect: rates differ from Tsim');
        } else if (c && c.error) {
          notes.push(c.error);
          if (c.k_inferred) notes.push(`K = ${c.k_inferred}, ${c.k_source}`);
        }
        const value = v === null ? '–' : cmp && bv !== null ? ratio(abs[i] / bv) : relative ? ratio(v) : fmt(abs[i]);
        tip.items.push({ engine, value, notes });
      });
      plot.dataset.tip = JSON.stringify(tip);
      row.append(name, ks, plot, vals);
      return row;
    });
    root.querySelector('[data-rows]').replaceChildren(...rows);
  }

  /* --- Tooltip, as bindTips in bloqade-website's src/lib/tsim-bench.ts --- */
  const host = root.querySelector('[data-tip-host]');
  let current = null;
  let pointerX = null;
  function showTip(target) {
    const tip = JSON.parse(target.dataset.tip);
    current?.classList.remove('is-active');
    current = target;
    target.classList.add('is-active');
    host.replaceChildren(
      el('p', 'tsb__tip-title', tip.title),
      ...tip.meta.map((line) => el('p', 'tsb__tip-meta', line)),
      ...tip.items.map((item) => {
        const box = el('div', `tsb__tip-item tsb__s${item.engine.slot}`);
        const head = el('div', 'tsb__tip-head');
        head.append(glyph(item.engine), el('span', 'tsb__tip-name', item.engine.label), el('strong', 'tsb__tip-value', item.value));
        box.append(head);
        if (item.notes.length) box.append(el('p', 'tsb__tip-notes', item.notes.join(' · ')));
        return box;
      }),
    );
    host.hidden = false;
    const r = target.getBoundingClientRect();
    const t = host.getBoundingClientRect();
    const left = Math.max(8, Math.min((pointerX ?? r.left + 120) - t.width / 2, window.innerWidth - t.width - 8));
    const above = r.top - t.height - 8;
    const top = above >= 8 ? above : Math.min(r.bottom + 8, window.innerHeight - t.height - 8);
    host.style.left = `${Math.round(left)}px`;
    host.style.top = `${Math.round(Math.max(8, top))}px`;
  }
  root.addEventListener('pointermove', (event) => {
    const target = event.target.closest('[data-tip]');
    pointerX = event.clientX;
    if (target && target !== current) showTip(target);
    if (!target && current) { current.classList.remove('is-active'); current = null; host.hidden = true; }
  });
  root.addEventListener('pointerleave', () => { current?.classList.remove('is-active'); current = null; host.hidden = true; });

  root.querySelectorAll('[data-setting]').forEach((group) =>
    group.querySelectorAll('button').forEach((button) =>
      button.addEventListener('click', () => {
        const key = group.dataset.setting;
        state[key] = button.dataset.value;
        // One comparison at a time: comparing one setting puts the other back on its target.
        if (key === 'threads' && state.threads === 'compare' && state.post === 'compare') state.post = 'on';
        if (key === 'post' && state.post === 'compare' && state.threads === 'compare') state.threads = '1t';
        if (key === 'mode' && state.mode === 'tsim' && state.threads === 'compare') state.threads = '1t';
        render();
      }),
    ),
  );

  root.querySelector('[data-specs]').replaceChildren(
    ...data.specs.flatMap(([term, text]) => [el('dt', '', term), el('dd', '', text)]),
  );
  render();

  new ResizeObserver(() => parent.postMessage({ tsbHeight: document.documentElement.scrollHeight }, '*')).observe(document.body);
})();
</script>
</body>
</html>
