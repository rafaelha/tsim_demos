<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
/* Light-mode tokens of bloqade-website's src/styles/brand.css */
:root {
  --color-bg: #ffffff; --color-fg: #1a1b22; --color-muted: #55596b; --color-border: #e6e6ef;
  --color-surface: #f7f7fb; --color-surface-hover: #f0eefb;
  --brand: #6437ff; --brand-strong: #4f27d6; --brand-soft: #efeaff; --on-brand: #ffffff;
  --viz-series-1: #6437ff; --viz-series-2: #eb6834; --viz-series-3: #1baf7a;
  --viz-series-4: #eda100; --viz-series-5: #d81b7a;
}
html, body { margin: 0; background: #ffffff; }
body {
  padding: 4px;
  font-family: 'Lato', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: var(--color-fg);
}
/* bloqade-website src/components/TsimBenchmarks.css */
/*__CSS__*/
/* Additions for this widget */
.tsb { margin: 0; }
.tsb__control[hidden] { display: none; }
.tsb__controls--view { margin-top: -0.35rem; }
.tsb__stem--dotted {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 80%, transparent) 0 2px, transparent 2px 5px);
}
.tsb__legend-line { display: inline-block; width: 16px; height: 2px; margin-right: -0.15rem; vertical-align: middle; }
.tsb__legend-line[data-line='solid'] { background: color-mix(in srgb, var(--tsb-color) 60%, transparent); }
.tsb__legend-line[data-line='dashed'] {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 70%, transparent) 0 5px, transparent 5px 8px);
}
.tsb__legend-line[data-line='dotted'] {
  background: repeating-linear-gradient(to right, color-mix(in srgb, var(--tsb-color) 80%, transparent) 0 2px, transparent 2px 4px);
}
.tsb__ks .is-inferred { font-style: italic; opacity: 0.75; }
.tsb__s5 { --tsb-color: var(--viz-series-5); }
.tsb--compare .tsb__head, .tsb--compare .tsb__row {
  grid-template-columns: 13rem 1.6rem minmax(0, 1fr) 4.6rem;
}
.tsb__lane-note { left: 0; }
.tsb__glyph path, .tsb__mark path { fill: var(--tsb-color); }
.tsb__mark.tsb__ring path, .tsb .tsb__mark.tsb__ring path { fill: var(--color-surface); stroke: var(--tsb-color); stroke-width: 1.5px; }
</style>
</head>
<body>
<figure class="tsb tsb--compare" data-sim data-metric="sampling">
  <div class="tsb__controls">
    <div class="tsb__control">
      <span class="tsb__control-label">Simulators</span>
      <div class="tsb__segments" role="group" data-setting="mode">
        <button type="button" data-value="all" aria-pressed="true">All</button>
        <button type="button" data-value="tsim" aria-pressed="false">Tsim devices</button>
      </div>
    </div>
    <div class="tsb__control">
      <span class="tsb__control-label">Measure</span>
      <div class="tsb__segments" role="group" data-setting="metric">
        <button type="button" data-value="sampling" aria-pressed="true">Sampling</button>
        <button type="button" data-value="compile" aria-pressed="false">Compilation</button>
      </div>
    </div>
    <div class="tsb__control" data-sampling-control>
      <span class="tsb__control-label">Postselection</span>
      <div class="tsb__segments" role="group" data-setting="post">
        <button type="button" data-value="on" aria-pressed="true">On</button>
        <button type="button" data-value="off" aria-pressed="false">Off</button>
        <button type="button" data-value="compare" aria-pressed="false">Compare</button>
      </div>
    </div>
    <div class="tsb__control" data-threads-control>
      <span class="tsb__control-label">CPU threads</span>
      <div class="tsb__segments" role="group" data-setting="threads">
        <button type="button" data-value="1t" aria-pressed="true">1</button>
        <button type="button" data-value="mt" aria-pressed="false">__CORES__</button>
        <button type="button" data-value="compare" aria-pressed="false">Compare</button>
      </div>
    </div>
    <div class="tsb__control" data-view-control>
      <span class="tsb__control-label">View</span>
      <div class="tsb__segments" role="group" data-setting="view">
        <button type="button" data-value="absolute" aria-pressed="true">Absolute</button>
        <button type="button" data-value="relative" aria-pressed="false">Relative</button>
      </div>
    </div>
  </div>
  <p class="tsb__note" data-note hidden></p>
  <ul class="tsb__legend" data-legend aria-label="Simulators shown; click to show or hide"></ul>
  <div class="tsb__chart" data-chart data-tip-group>
    <div class="tsb__head" aria-hidden="true">
      <span class="tsb__head-name">Circuit</span>
      <span class="tsb__head-k" title="K: most qubits in a dense statevector at once">K</span>
      <div class="tsb__ticks" data-ticks></div>
      <span class="tsb__head-unit" data-unit></span>
    </div>
    <div data-rows></div>
  </div>
  <div class="tsb__tip" data-tip-host aria-hidden="true" hidden></div>
  <details class="tsb__details">
    <summary>Run details</summary>
    <dl class="tsb__specs" data-specs></dl>
  </details>
</figure>
<script type="application/json" data-model>/*__DATA__*/</script>
<script>
(() => {
  const root = document.querySelector('[data-sim]');
  const data = JSON.parse(document.querySelector('[data-model]').textContent);
  const state = { mode: 'all', metric: 'sampling', threads: '1t', post: 'on', view: 'absolute' };
  const hidden = new Set();

  const MARKERS = {
    square: 'M-3.6 -3.6h7.2v7.2h-7.2Z',
    triangle: 'M0 -4.9L4.5 3.2L-4.5 3.2Z',
    diamond: 'M0 -5L4.7 0L0 5L-4.7 0Z',
    cross: 'M-5.4 -2.4h3v-3h4.8v3h3v4.8h-3v3h-4.8v-3h-3Z',
    circle: 'M-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0Z',
  };
  const svgNS = 'http://www.w3.org/2000/svg';
  const glyph = (engine, className = 'tsb__glyph') => {
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', className);
    svg.setAttribute('viewBox', '-6 -6 12 12');
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', MARKERS[engine.shape]);
    svg.append(path);
    return svg;
  };
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const sig = (v) => Number(v.toPrecision(3));
  const rate = (v) => v >= 1e9 ? `${sig(v / 1e9)} B` : v >= 1e6 ? `${sig(v / 1e6)} M` : v >= 1e3 ? `${sig(v / 1e3)} k` : `${sig(v)}`;
  const secs = (v) => v >= 1 ? `${sig(v)} s` : `${sig(v * 1e3)} ms`;
  const ratio = (v) => v >= 1e4 ? `${rate(v).replace(' ', '')}×` : v >= 100 ? `${Math.round(v).toLocaleString('en-US')}×` : `${sig(v)}×`;
  const fmt = (v) => state.metric === 'sampling' ? rate(v) : secs(v);

  const compare = () => state.metric === 'sampling' ? (state.threads === 'compare' ? 'threads' : state.post === 'compare' ? 'post' : null) : null;
  const engines = () => data.modes[state.mode].map((id) => data.engines[id]);
  const cellOf = (circuit, engine, threads, post) => {
    const config = engine.configs[engine.configs.length === 1 ? 0 : threads === 'mt' ? 1 : 0];
    return (data.cells[circuit.id] || {})[post === 'off' ? `${config}|post-off` : config];
  };
  const valueOf = (c) => (!c || c.error ? null : state.metric === 'sampling' ? c.shots_per_s : c.compile_s);
  /** The target setting (filled mark) and, when comparing, the baseline (open mark). */
  const target = () => ({ threads: state.threads === 'compare' ? 'mt' : state.threads, post: state.post === 'compare' ? 'on' : state.post });
  const baseline = () => compare() === 'threads' ? { ...target(), threads: '1t' } : compare() === 'post' ? { ...target(), post: 'off' } : null;

  const SETTINGS = [];
  ['1t', 'mt'].forEach((threads) => ['on', 'off'].forEach((post) => SETTINGS.push({ threads, post })));

  /** Relative: each row's slowest engine at 1× (for compile time, the slowest to compile). */
  function relatives(circuit, shown, setting) {
    const vals = shown.map((engine) => valueOf(cellOf(circuit, engine, setting.threads, setting.post)));
    const ok = vals.filter((v) => v !== null && v > 0);
    if (!ok.length) return vals.map(() => null);
    const ref = state.metric === 'sampling' ? Math.min(...ok) : Math.max(...ok);
    return vals.map((v) => (v === null || v <= 0 ? null : state.metric === 'sampling' ? v / ref : ref / v));
  }

  /* One axis per mode, metric and view, over every thread and postselection setting, so that
     toggling a setting moves marks, never the scale. */
  function axis(shown) {
    const values = [];
    data.circuits.forEach((circuit) =>
      SETTINGS.forEach((setting) => {
        if (state.view === 'relative' && !compare()) values.push(...relatives(circuit, shown, setting).filter((v) => v));
        else shown.forEach((engine) => {
          const v = valueOf(cellOf(circuit, engine, setting.threads, setting.post));
          if (v && v > 0) values.push(v);
        });
      }),
    );
    if (!values.length) return { lo: 0, hi: 1 };
    let lo = state.view === 'relative' && !compare() ? 0 : Math.floor(Math.log10(Math.min(...values)));
    let hi = Math.ceil(Math.log10(Math.max(...values)));
    if (hi - lo < 1) hi = lo + 1;
    return { lo, hi };
  }
  const position = (v, ax) => ((Math.log10(v) - ax.lo) / (ax.hi - ax.lo)) * 100;

  function shortError(error) {
    if (/timeout/i.test(error)) return 'timeout';
    if (/memory|OOM/i.test(error)) return 'out of memory';
    if (/k_max|active width|active qubits|too wide|too large|> ?11|limit/i.test(error)) return 'too wide';
    if (/rotation/i.test(error)) return 'no rotations';
    if (/unsupported/i.test(error)) return 'unsupported';
    if (/setup/i.test(error)) return 'not installed';
    return 'error';
  }

  function legend() {
    const host = root.querySelector('[data-legend]');
    host.replaceChildren(
      ...engines().map((engine) => {
        const item = el('li', `tsb__legend-item tsb__s${engine.slot}`);
        const button = el('button', 'tsb__legend-toggle');
        button.type = 'button';
        button.setAttribute('aria-pressed', String(!hidden.has(engine.id)));
        const line = el('span', 'tsb__legend-line');
        line.dataset.line = engine.line;
        button.append(line, glyph(engine), el('span', '', engine.label));
        button.addEventListener('click', () => {
          if (hidden.has(engine.id)) hidden.delete(engine.id);
          else if (engines().filter((e) => !hidden.has(e.id)).length > 1) hidden.add(engine.id);
          render();
        });
        item.append(button);
        return item;
      }),
    );
  }

  const LABELS = { threads: { '1t': '1 thread', mt: `${data.cores} threads` }, post: { on: 'postselection on', off: 'postselection off' } };

  function render() {
    const shown = engines().filter((engine) => !hidden.has(engine.id));
    const cmp = compare();
    const relative = state.view === 'relative' && !cmp;
    const ax = axis(shown);
    const tgt = target();
    const base = baseline();

    root.dataset.metric = state.metric;
    root.dataset.view = relative ? 'relative' : 'absolute';
    root.querySelector('[data-threads-control]').hidden = state.metric === 'compile' || state.mode === 'tsim';
    root.querySelector('[data-sampling-control]').hidden = state.metric === 'compile';
    root.querySelector('[data-view-control]').hidden = !!cmp;
    root.querySelectorAll('[data-setting]').forEach((group) =>
      group.querySelectorAll('button').forEach((button) =>
        button.setAttribute('aria-pressed', String(button.dataset.value === state[group.dataset.setting])),
      ),
    );
    const note = root.querySelector('[data-note]');
    note.textContent = cmp
      ? `Each lane runs from ${LABELS[cmp][base[cmp]]} (open mark) to ${LABELS[cmp][tgt[cmp]]} (filled mark); the value is how many times faster.`
      : relative
        ? state.metric === 'sampling' ? 'Each row puts its slowest simulator at 1×.' : 'Each row puts the simulator slowest to compile at 1×.'
        : '';
    note.hidden = !note.textContent;
    legend();

    const chart = root.querySelector('[data-chart]');
    chart.style.setProperty('--decades', String(ax.hi - ax.lo));
    root.querySelector('[data-unit]').textContent = relative ? (state.metric === 'sampling' ? 'vs slowest' : 'vs slowest') : cmp ? 'speedup' : state.metric === 'sampling' ? 'shots/s' : 'compile';
    const ticks = [];
    const step = ax.hi - ax.lo > 8 ? 2 : 1;
    for (let d = ax.lo; d <= ax.hi; d += step) {
      const label = relative ? ratio(10 ** d) : state.metric === 'sampling' ? rate(10 ** d).replace(' ', '') : secs(10 ** d);
      const tick = el('span', 'tsb__tick', label);
      tick.style.left = `${position(10 ** d, ax)}%`;
      ticks.push(tick);
    }
    root.querySelector('[data-ticks]').replaceChildren(...ticks);

    const rows = data.circuits.map((circuit) => {
      const cells = shown.map((engine) => cellOf(circuit, engine, tgt.threads, tgt.post));
      const bases = shown.map((engine) => (base ? cellOf(circuit, engine, base.threads, base.post) : null));
      const abs = cells.map(valueOf);
      const rel = relative ? relatives(circuit, shown, tgt) : null;
      const plotted = relative ? rel : abs;
      const ok = plotted.filter((v) => v !== null);
      const best = ok.length ? (relative || state.metric === 'sampling' ? Math.max(...ok) : Math.min(...ok)) : null;
      const tsim1 = state.metric === 'sampling' ? valueOf(cellOf(circuit, data.engines['tsim-1t'], '1t', tgt.post)) : null;

      const row = el('div', 'tsb__row');
      const name = el('div', 'tsb__name');
      const link = el('a', '', circuit.label);
      link.href = circuit.url;
      link.target = '_blank';
      name.append(link, el('span', 'tsb__meta', circuit.meta));
      const ks = el('div', 'tsb__ks');
      const plot = el('div', 'tsb__plot');
      const vals = el('div', 'tsb__values');
      const tip = { title: circuit.label, meta: [circuit.meta, circuit.paper], items: [] };

      shown.forEach((engine, i) => {
        const c = cells[i];
        const v = plotted[i];
        const b = bases[i];
        const bv = base && b && b !== c ? valueOf(b) : null;

        const k = c && !c.error && c.k_max !== null && c.k_max !== undefined ? String(c.k_max) : c && c.k_inferred ? c.k_inferred : '';
        const kSpan = el('span', c && c.error && c.k_inferred ? 'is-inferred' : '', k);
        if (c && (c.k_source || c.k_name)) kSpan.title = c.error ? `K ${c.k_source}` : c.k_name;
        ks.append(kSpan);

        const lane = el('div', `tsb__lane tsb__s${engine.slot}`);
        lane.dataset.kind = v === null ? 'na' : 'ok';
        if (v !== null) {
          lane.style.setProperty('--x', `${position(v, ax)}%`);
          const stem = el('span', `tsb__stem${engine.line === 'dashed' ? ' tsb__stem--proxy' : engine.line === 'dotted' ? ' tsb__stem--dotted' : ''}`);
          lane.append(stem);
          if (bv !== null) {
            lane.dataset.compare = '';
            lane.style.setProperty('--from', `${position(bv, ax)}%`);
            lane.append(glyph(engine, 'tsb__mark tsb__mark--base tsb__ring'));
          }
          lane.append(glyph(engine, 'tsb__mark'));
        } else {
          lane.append(el('span', 'tsb__lane-note', c ? shortError(c.error || '') : 'not run'));
        }
        plot.append(lane);

        let text = '–';
        if (v !== null) text = cmp ? (bv !== null ? ratio(abs[i] / bv) : '') : relative ? ratio(v) : fmt(v);
        const span = el('span', !cmp && v !== null && v === best ? 'is-best' : '', text);
        span.dataset.kind = v === null ? 'na' : 'ok';
        vals.append(span);

        const notes = [];
        if (c && !c.error) {
          if (cmp && bv !== null) notes.push(`${LABELS[cmp][base[cmp]]}: ${fmt(bv)} → ${LABELS[cmp][tgt[cmp]]}: ${fmt(abs[i])}`);
          if (relative) notes.push(state.metric === 'sampling' ? `${rate(abs[i])} shots/s` : `compile ${secs(abs[i])}`);
          if (state.metric === 'sampling') notes.push(`compile ${secs(c.compile_s)}`);
          else notes.push(`${rate(c.shots_per_s)} shots/s`);
          if (k) notes.push(`K = ${k}`);
          if (state.metric === 'sampling' && typeof c.kept === 'number' && tgt.post === 'on') notes.push(`${sig(c.kept * 100)}% kept`);
          if (c.threads) notes.push(`${c.threads} thread${c.threads === 1 ? '' : 's'}`);
          if (tsim1 && abs[i] && state.metric === 'sampling' && engine.id !== 'tsim-1t') notes.push(`${ratio(abs[i] / tsim1)} Tsim CPU, 1 thread`);
          if (c.post_note) notes.push(c.post_note);
          if (c.note) notes.push(c.note);
          if (c.suspect) notes.push('suspect: rates differ from Tsim');
        } else if (c && c.error) {
          notes.push(c.error);
          if (c.k_inferred) notes.push(`K = ${c.k_inferred}, ${c.k_source}`);
        }
        const value = v === null ? '–' : cmp && bv !== null ? ratio(abs[i] / bv) : relative ? ratio(v) : fmt(abs[i]);
        tip.items.push({ engine, value, notes });
      });
      plot.dataset.tip = JSON.stringify(tip);
      row.append(name, ks, plot, vals);
      return row;
    });
    root.querySelector('[data-rows]').replaceChildren(...rows);
  }

  /* --- Tooltip, as bindTips in bloqade-website's src/lib/tsim-bench.ts --- */
  const host = root.querySelector('[data-tip-host]');
  let current = null;
  let pointerX = null;
  function showTip(target) {
    const tip = JSON.parse(target.dataset.tip);
    current?.classList.remove('is-active');
    current = target;
    target.classList.add('is-active');
    host.replaceChildren(
      el('p', 'tsb__tip-title', tip.title),
      ...tip.meta.map((line) => el('p', 'tsb__tip-meta', line)),
      ...tip.items.map((item) => {
        const box = el('div', `tsb__tip-item tsb__s${item.engine.slot}`);
        const head = el('div', 'tsb__tip-head');
        head.append(glyph(item.engine), el('span', 'tsb__tip-name', item.engine.label), el('strong', 'tsb__tip-value', item.value));
        box.append(head);
        if (item.notes.length) box.append(el('p', 'tsb__tip-notes', item.notes.join(' · ')));
        return box;
      }),
    );
    host.hidden = false;
    const r = target.getBoundingClientRect();
    const t = host.getBoundingClientRect();
    const left = Math.max(8, Math.min((pointerX ?? r.left + 120) - t.width / 2, window.innerWidth - t.width - 8));
    const above = r.top - t.height - 8;
    const top = above >= 8 ? above : Math.min(r.bottom + 8, window.innerHeight - t.height - 8);
    host.style.left = `${Math.round(left)}px`;
    host.style.top = `${Math.round(Math.max(8, top))}px`;
  }
  root.addEventListener('pointermove', (event) => {
    const target = event.target.closest('[data-tip]');
    pointerX = event.clientX;
    if (target && target !== current) showTip(target);
    if (!target && current) { current.classList.remove('is-active'); current = null; host.hidden = true; }
  });
  root.addEventListener('pointerleave', () => { current?.classList.remove('is-active'); current = null; host.hidden = true; });

  root.querySelectorAll('[data-setting]').forEach((group) =>
    group.querySelectorAll('button').forEach((button) =>
      button.addEventListener('click', () => {
        const key = group.dataset.setting;
        state[key] = button.dataset.value;
        // One comparison at a time: comparing one setting puts the other back on its target.
        if (key === 'threads' && state.threads === 'compare' && state.post === 'compare') state.post = 'on';
        if (key === 'post' && state.post === 'compare' && state.threads === 'compare') state.threads = '1t';
        if (key === 'mode' && state.mode === 'tsim' && state.threads === 'compare') state.threads = '1t';
        render();
      }),
    ),
  );

  root.querySelector('[data-specs]').replaceChildren(
    ...data.specs.flatMap(([term, text]) => [el('dt', '', term), el('dd', '', text)]),
  );
  render();

  new ResizeObserver(() => parent.postMessage({ tsbHeight: document.documentElement.scrollHeight }, '*')).observe(document.body);
})();
</script>
</body>
</html>
